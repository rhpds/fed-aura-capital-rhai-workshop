---
# -------------------------------------------------------------------
# --- RHAI Features Workshop: AgentOps Observability (Tenant Provisioner)
# --- Order ONCE per student after the cluster provisioner is running.
# --- Provisions a Keycloak user, per-user namespaces, showroom, and
# --- per-user GitOps bootstrap-tenant app.
# -------------------------------------------------------------------

#include /includes/catalog-icon-openshift-ai.yaml

#include /includes/sandbox-api.yaml
#include /includes/agd-v2-mapping.yaml
#include /includes/terms-of-service.yaml
#include /includes/access-restriction-devs-only.yaml

#include /includes/parameters/purpose.yaml

# -------------------------------------------------------------------
# Top Variables
# -------------------------------------------------------------------
cloud_provider: none
config: namespace
openshift_api_url: "{{ sandbox_openshift_api_url }}"
openshift_cluster_admin_token: "{{ cluster_admin_agnosticd_sa_token }}"

# -------------------------------------------------------------------
# Collections
# -------------------------------------------------------------------
tag: main

requirements_content:
  collections:
  - name: https://github.com/agnosticd/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11
  - name: https://github.com/rhpds/rhpds-ftl.git
    type: git
    version: main

# -------------------------------------------------------------------
# Workloads — per-user only; no infra/cluster roles here
# -------------------------------------------------------------------
workloads: >-
  {{
    [
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user',
      'agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace',
      'agnosticd.core_workloads.ocp4_workload_gitops_bootstrap',
      'agnosticd.showroom.ocp4_workload_showroom',
      'rhpds.ftl.ocp4_workload_runtime_automation_k8s'
    ] +
    (
      ['rhpds.ftl.ocp4_runtime_automation_load_test']
      if run_e2e_load_test | default(false) | bool
      else []
    )
  }}

remove_workloads:
- rhpds.ftl.ocp4_workload_runtime_automation_k8s
- agnosticd.showroom.ocp4_workload_showroom
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user

# -------------------------------------------------------------------
# Workload variables
# -------------------------------------------------------------------
ocp4_workload_user_password: >-
  {{ lookup('password', output_dir ~ '/ocp4_workload_user_password', length=12, chars=['ascii_letters', 'digits']) }}

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_username: "user-{{ guid }}"
ocp4_workload_tenant_keycloak_user_password: "{{ ocp4_workload_user_password }}"
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_namespace_use_cluster_quota: true

ocp4_workload_tenant_namespace_namespaces:
- "wksp-{{ ocp4_workload_tenant_keycloak_username }}"
- "showroom-{{ ocp4_workload_tenant_keycloak_username }}"

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "8"
  requests.cpu: "4"
  limits.memory: 32Gi
  requests.memory: 32Gi
  requests.storage: 100Gi

ocp4_workload_tenant_namespace_default_limit_range:
  default:
    cpu: "2"
    memory: 8Gi
  defaultRequest:
    cpu: 250m
    memory: 1Gi

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitops_bootstrap
# Deploys per-user namespace + RBAC via ArgoCD bootstrap-tenant.
# Cluster-level services are deployed by the cluster catalog item.
# -------------------------------------------------------------------
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/rhai-features-workshop
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-tenant
ocp4_workload_gitops_bootstrap_application_project: tenants
ocp4_workload_gitops_bootstrap_application_name: "bootstrap-tenant-{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_gitops_bootstrap_kustomize_envvar_plugin: false
ocp4_workload_gitops_bootstrap_helm_values:
  username: "{{ ocp4_workload_tenant_keycloak_username }}"
  deployer:
    domain: "{{ openshift_cluster_ingress_domain }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_namespace: "showroom-{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/rhai-features-workshop
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod
ocp4_workload_showroom_deployer_chart_version: "2.1.4"
ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11
ocp4_workload_showroom_runtime_automation_enable: true
ocp4_workload_showroom_runtime_automation_image: "quay.io/rhpds/zt-runner:v2.4.2"
ocp4_workload_showroom_antora_enable_dev_mode: "false"
ocp4_workload_showroom_passthrough_user_data: true

ocp4_workload_showroom_user_data:
  openshift_api_url: "{{ sandbox_openshift_api_url }}"
  openshift_console_url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  user_project: "wksp-{{ ocp4_workload_tenant_keycloak_username }}"
  username: "{{ ocp4_workload_tenant_keycloak_username }}"
  password: "{{ ocp4_workload_user_password }}"

ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: OCP Console
    url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
  - name: Terminal
    path: /terminal
    port: 443
  - name: MLflow Console
    url: 'https://rh-ai.{{ openshift_cluster_ingress_domain }}/mlflow/'
  - name: Mortgage AI App
    url: 'https://mortgage-ai-ui-route-wksp-{{ ocp4_workload_tenant_keycloak_username }}.{{ openshift_cluster_ingress_domain }}'
  - name: Grafana
    url: 'https://grafana-route-wksp-{{ ocp4_workload_tenant_keycloak_username }}.{{ openshift_cluster_ingress_domain }}'
  - name: RHOAI Console
    url: 'https://rh-ai.{{ openshift_cluster_ingress_domain }}/'
  - name: MLflow Docs
    url: 'https://mlflow.org/docs/latest/genai/tracing/'
  - name: RHOAI Docs
    url: 'https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/'

# -------------------------------------------------------------------
# Workload: ocp4_workload_runtime_automation_k8s — ZT runner SA
# -------------------------------------------------------------------
ocp4_workload_runtime_automation_k8s_cluster_admin: true
ocp4_workload_runtime_automation_k8s_openshift_api_url: "{{ sandbox_openshift_api_url }}"
ocp4_workload_runtime_automation_k8s_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token }}"

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------
__meta__:
  asset_uuid: b4e91c30-7f82-4a15-dc56-a9e0123bcd78
  owners:
    maintainer:
    - name: Ritesh Shah
      email: rshah@redhat.com
    instructions:
    - name: Ritesh Shah
      email: rshah@redhat.com
  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
  sandbox_api:
    actions:
      destroy:
        catch_all: false
  catalog:
    display_name: "RHAI Features Workshop: AgentOps Observability — Tenant Provisioner"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
    - rhai-features
    - agentops
    - openshift-ai
    - rhoai
    - mlflow
    - observability
    labels:
      Provider: RHDP
      Product: Red_Hat_OpenShift_AI
      Product_Family: Red_Hat_AI
    reportingLabels:
      primaryBU: Hybrid_Platforms
    multiuser: false
    workshopLabUiRedirect: true
    parameters:
    - name: purpose
      description: "Purpose tag for cost tracking."
      formLabel: "Purpose"
      openAPIV3Schema:
        type: string
        default: development
        enum:
        - development
        - event
    - name: run_e2e_load_test
      description: "Run E2E load test after provisioning — triggers solve and validate on all modules"
      formLabel: "Run E2E Load Test"
      openAPIV3Schema:
        type: boolean
        default: false

  sandboxes:
  - kind: OcpSandbox
    namespace_suffix: user
    cloud_selector:
      cloud: cnv-dedicated-shared
      purpose: dev
      lab: rhai-features-workshop-cnv
  tower:
    timeout: 3600
