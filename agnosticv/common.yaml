---
# -------------------------------------------------------------------
# --- Catalog Item: Fed Aura Capital Workshop
# --- AgentOps Observability with Red Hat OpenShift AI
# -------------------------------------------------------------------

#include /includes/agd-v2-mapping.yaml
#include /includes/catalog-icon-openshift.yaml
#include /includes/terms-of-service.yaml
#include /includes/sandbox-api.yaml

#include /includes/parameters/purpose.yaml

#include /includes/secrets/litemaas-master_api.yaml
requester_email: rhai-features-{{guid}}@demo.redhat.com
catalog_item_name: rhai-features.rhai-features-workshop-cnv.{{stage | default('dev')}}

# -------------------------------------------------------------------
# AgnosticDv2 variables
# -------------------------------------------------------------------
common_password: >-
  {{ lookup('password', output_dir ~ '/common_password', length=12, chars=['ascii_letters', 'digits']) }}

config: openshift-workloads
cloud_provider: none
# Workers required for shared-cluster multi-user topology
openshift_cnv_scale_cluster: true

# num_users is a catalog parameter selected at deploy time (default 15, max 20)
# Worker count is fixed at 3 nodes; adjust ai_workers_cores/memory at infra review
# once per-user resource profiles are measured from a test deployment.
worker_instance_count: 3
ai_workers_cores: 64
ai_workers_memory: 256Gi
worker_only: true

clusters:
- default:
    api_url: "{{ openshift_api_url }}"
    api_token: "{{ openshift_cluster_admin_token }}"

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
tag: main
requirements_content:
  collections:

  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"

  - name: https://github.com/rhpds/ai_workloads.git
    type: git
    version: "{{ tag }}"

  # LiteLLM Virtual Keys Collection
  - name: https://github.com/rhpds/rhpds.litellm_virtual_keys.git
    type: git
    version: "{{ tag }}"

  # Showroom
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.11

# ===================================================================
# List of workloads to be deployed
# ===================================================================
workloads:

- agnosticd.core_workloads.ocp4_workload_authentication
- agnosticd.ai_workloads.ocp4_workload_openshift_ai
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys
- agnosticd.core_workloads.ocp4_workload_gitops_bootstrap
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

remove_workloads:

- rhpds.litellm_virtual_keys.ocp4_workload_litellm_virtual_keys

# ===================================================================
# Workload: ocp4_workload_authentication
# ===================================================================
ocp4_workload_authentication_provider: keycloak
ocp4_workload_authentication_namespace: keycloak
ocp4_workload_authentication_channel: stable-v26.4
ocp4_workload_authentication_use_catalog_source: false

ocp4_workload_authentication_admin_create: true
ocp4_workload_authentication_admin_username: admin
ocp4_workload_authentication_admin_password: "{{ common_password }}"
ocp4_workload_authentication_remove_kubeadmin: true

ocp4_workload_authentication_num_users: "{{ num_users | int }}"
ocp4_workload_authentication_user_username_base: user
ocp4_workload_authentication_user_password: "{{ common_password }}"

# ===================================================================
# Workload: ocp4_workload_openshift_ai
# ===================================================================
ocp4_workload_openshift_ai_channel: fast-3.x
ocp4_workload_openshift_ai_use_catalog_snapshot: false
ocp4_workload_openshift_ai_deploy_dsc: true
ocp4_workload_openshift_ai_dashboard: Managed
ocp4_workload_openshift_ai_datasciencepipelines: Managed
ocp4_workload_openshift_ai_workbenches: Managed
ocp4_workload_openshift_ai_modelmeshserving: Managed
ocp4_workload_openshift_ai_kserve: Removed
ocp4_workload_openshift_ai_ray: Removed
ocp4_workload_openshift_ai_trustyai: Removed
ocp4_workload_openshift_ai_trainingoperator: Removed
ocp4_workload_openshift_ai_modelregistry: Managed
ocp4_workload_openshift_ai_codeflare: Removed
ocp4_workload_openshift_ai_feastoperator: Removed
ocp4_workload_openshift_ai_llamastackoperator: Managed
ocp4_workload_openshift_ai_kueue: Removed
ocp4_workload_openshift_ai_aipipelines: Managed

# ===================================================================
# Workload: ocp4_workload_openshift_gitops
# ===================================================================
ocp4_workload_openshift_gitops_channel: latest
ocp4_workload_openshift_gitops_use_catalog_snapshot: false

ocp4_workload_openshift_gitops_setup_cluster_admin: true
ocp4_workload_openshift_gitops_update_route_tls: true

ocp4_workload_openshift_gitops_rbac_update: true
ocp4_workload_openshift_gitops_rbac_policy: |
  g, system:cluster-admins, role:admin
  g, admin, role:admin
ocp4_workload_openshift_gitops_rbac_scopes: '[name,groups]'

ocp4_workload_openshift_gitops_resource_tracking_method: annotation

# ===================================================================
# Workload: ocp4_workload_litellm_virtual_keys + LLM model
# ===================================================================
llm_model: gpt-oss-120b
ocp4_workload_litellm_virtual_keys_duration: "7d"
ocp4_workload_litellm_virtual_keys_models:
- "{{ llm_model }}"

# ===================================================================
# Workload: ocp4_workload_gitops_bootstrap
# ===================================================================
ocp4_workload_gitops_bootstrap_repo_url: https://github.com/rhpds/rhai-features-workshop
ocp4_workload_gitops_bootstrap_repo_revision: main
ocp4_workload_gitops_bootstrap_repo_path: automation/gitops/bootstrap-infra
ocp4_workload_gitops_bootstrap_kustomize_envvar_plugin: false
ocp4_workload_gitops_bootstrap_helm_values:
  deployer:
    domain: "{{ openshift_cluster_ingress_domain }}"
    apiUrl: "{{ openshift_api_url }}"
  user:
    count: "{{ num_users | default(1) }}"
  remotellm:
    id: "{{ llm_model }}"
    url: "{{ litellm_api_endpoint }}"
    apiToken: "{{ litellm_virtual_key }}"
    enabled: true

# ===================================================================
# Workload: ocp4_workload_showroom
# ===================================================================
ocp4_workload_showroom_antora_enable_dev_mode: "false"
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/rhai-features-workshop
ocp4_workload_showroom_content_git_repo_ref: main

ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11

ocp4_workload_showroom_passthrough_user_data: true

ocp4_workload_showroom_user_data:
  openshift_api_url: "{{ openshift_api_url }}"
  openshift_console_url: "https://console-openshift-console.{{ openshift_cluster_ingress_domain }}"
  user_project: "wksp-{{ ocp4_workload_authentication_user_username_base }}1"

ocp4_workload_showroom_content_ui_config: |
  type: showroom
  default_width: 30
  persist_url_state: true
  view_switcher:
    enabled: true
    default_mode: split
  tabs:
  - name: OCP Console
    url: 'https://console-openshift-console.{{ openshift_cluster_ingress_domain }}'
  - name: Terminal
    path: /terminal
    port: 443
  - name: MLflow Console
    url: 'https://rh-ai.{{ openshift_cluster_ingress_domain }}/mlflow/'
  - name: Mortgage AI App
    url: 'https://mortgage-ai-ui-route-wksp-{{ ocp4_workload_authentication_user_username_base }}1.{{ openshift_cluster_ingress_domain }}'
  - name: Grafana
    url: 'https://grafana-route-wksp-{{ ocp4_workload_authentication_user_username_base }}1.{{ openshift_cluster_ingress_domain }}'
  - name: RHOAI Console
    url: 'https://rh-ai.{{ openshift_cluster_ingress_domain }}/'
  - name: MLflow Docs
    url: 'https://mlflow.org/docs/latest/genai/tracing/'
  - name: RHOAI Docs
    url: 'https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/'

# -------------------------------------------------------------------
# Babylon meta variables
# -------------------------------------------------------------------

__meta__:
  asset_uuid: 07149a73-591e-4879-8cf4-76f079bb7402
  owners:
    maintainer:
    - name: Ritesh Shah
      email: rshah@redhat.com
    instructions:
    - name: Ritesh Shah
      email: rshah@redhat.com
  catalog:
    display_name: "Fed Aura Capital Workshop: AgentOps Observability with Red Hat OpenShift AI"
    category: Workshops
    namespace: babylon-catalog-{{ stage | default('?') }}
    keywords:
    - rhai-features
    - agentops
    - openshift-ai
    - rhoai
    - mlflow
    - observability
    labels:
      Provider: RHDP
    reportingLabels:
      primaryBU: Hybrid_Platforms
    multiuser: true
    workshop_user_mode: multi
    parameters:
    - name: num_users
      description: "Number of users to provision within the shared cluster."
      formLabel: "User Count"
      openAPIV3Schema:
        type: integer
        default: 15
        minimum: 1
        maximum: 20
    - name: showroom_language
      description: "Select the language for your lab instructions."
      formLabel: "Select your lab instruction language"
      openAPIV3Schema:
        type: string
        default: main
        enum:
        - main
      variable: ocp4_workload_showroom_content_git_repo_ref

  components:
  - name: openshift
    display_name: OpenShift Cluster
    item: agd-v2/ocp-cluster-cnv-pools
    parameter_values:
      cluster_size: multinode
      host_ocp4_installer_version: '4.20'
      num_users: "{{ num_users }}"
    propagate_provision_data:
    - name: openshift_api_ca_cert
      var: openshift_api_ca_cert
    - name: openshift_api_url
      var: openshift_api_url
    - name: openshift_cluster_admin_token
      var: openshift_api_key
    - name: openshift_cluster_admin_token
      var: openshift_cluster_admin_token
    - name: bastion_public_hostname
      var: bastion_ansible_host
    - name: bastion_ssh_user_name
      var: bastion_ansible_user
    - name: bastion_ssh_password
      var: bastion_ansible_ssh_pass
    - name: bastion_ssh_port
      var: bastion_ansible_port
    - name: sandbox_openshift_api_key
      var: sandbox_openshift_api_key
    - name: sandbox_openshift_api_url
      var: sandbox_openshift_api_url
    - name: sandbox_openshift_namespace
      var: sandbox_openshift_namespace

  deployer:
    scm_url: https://github.com/rhpds/agnosticd-v2
    scm_ref: main
    execution_environment:
      image: quay.io/agnosticd/ee-multicloud:chained-2026-05-04
      pull: missing
    actions:
      destroy:
        disable: false
      start:
        disable: false
      status:
        disable: true
      stop:
        disable: false
      update:
        disable: true
