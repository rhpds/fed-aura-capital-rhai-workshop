# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false   # "basic familiarity" prerequisites cannot be automatically validated
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: >-
      This intermediate-level hands-on lab uses the Fed Aura Capital mortgage lending application —
      a five-agent LangGraph system that debuted at Red Hat Summit 2026 — to teach AgentOps
      observability using Red Hat OpenShift AI. Participants monitor AI-specific metrics with Grafana,
      analyze structured logs with LokiStack, and trace end-to-end agent execution with MLflow;
      optional modules add automated LLM evaluation pipelines via RHOAI Data Science Pipelines.
      It replaces the Parasol Insurance AI workshop as the primary customer-facing vehicle for RHOAI 3.x adoption.
    module_summaries:
      - title: "The Agentic App and Why Observability Matters"
        overview: >-
          Students explore the pre-deployed Fed Aura Capital multi-agent mortgage application,
          run CLI health checks, interact with the CEO agent persona to generate conversation data,
          and experience the observability gap firsthand — the application is healthy by platform
          metrics but its internal reasoning and tool calls are invisible.
      - title: "Observability Pillars, Concepts, and Personas"
        overview: >-
          A conceptual module that maps the three observability pillars (metrics, logs, traces) to
          specific operational questions in the mortgage AI system and distinguishes the different
          observability needs of SRE vs. AI Developer personas.
      - title: "Metrics and Logs for Agentic Applications"
        overview: >-
          Students navigate a pre-deployed Grafana dashboard displaying AI-specific metrics (LLM token
          usage, inference latency, tool-call success rates) and then use LokiStack with LogQL to scope
          and filter structured JSON logs from the multi-agent service.
      - title: "Tracing and MLflow"
        overview: >-
          Students access the RHOAI MLflow tracking server and trace the CEO agent conversations from
          Module 1 end-to-end — drilling into input/output shield spans, LLM calls with full
          prompt/completion text, tool authorization decisions, and multi-turn session grouping.
      - title: "Agent and LLM Evaluations (Optional)"
        overview: >-
          An optional advanced module where students launch a RHOAI Jupyter workbench, run an
          evaluation notebook, register the prospect agent's prompt in the MLflow Prompt Registry,
          build a six-case evaluation dataset, and execute both deterministic and LLM-as-a-Judge scorers.
      - title: "From Development to Production (Optional)"
        overview: >-
          An optional advanced module that automates the Module 5 evaluation into a Kubeflow-based
          RHOAI Data Science Pipeline, then detects a prompt regression (mandatory-to-optional tool-use
          change) before production, demonstrating the quality gate pattern for AI prompt management.
    rcars_overlap_pct: 100
    rcars_top_matches:
      - title: "AgentOps in Production — AI Observability on OpenShift"
        ci_name: "published.agentops-ocp.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.agentops-ocp.prod"
        relevance_score: 100
        why_it_fits: "Direct content match — same multi-agent mortgage application, same observability stack (Prometheus, LokiStack, Grafana, MLflow, Kubeflow Pipelines), same audience. 1,098 provisions/quarter."
      - title: "LB2144: AI AgentOps OpenShift (AWS)"
        ci_name: "summit-2026.lb2144-agentops-ocp-aws.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=summit-2026.lb2144-agentops-ocp-aws.prod"
        relevance_score: 100
        why_it_fits: "Summit 2026 AWS variant of the same content — all modules, same audience; event-scoped and AWS-backed rather than CNV."
        workloads:
          - role: "ocp4_workload_authentication"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_gitops_bootstrap"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_litellm_virtual_keys"
            collection: "rhpds.litellm_virtual_keys"
          - role: "ocp4_workload_ocp_console_embed"
            collection: "agnosticd.showroom"
          - role: "ocp4_workload_openshift_gitops"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_showroom"
            collection: "agnosticd.showroom"
      - title: "Taking MCP Servers to Production on OpenShift AI with the Red Hat MCP Registry"
        ci_name: "published.openshift-mcp-lab.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.openshift-mcp-lab.prod"
        relevance_score: 37
        why_it_fits: "Partial overlap on SRE/Platform Engineer audience and OpenShift AI observability; focuses on MCP governance/ToolHive rather than MLflow tracing or LLM evaluations."
    catalog_gap: "The two 100% matches are existing catalog items derived from the same imported source content (agentops-in-prod-showroom). The Fed Aura Capital Workshop migration establishes the CNV-native, RHOAI 3.x successor on a durable catalog path; differentiation grows as end-to-end RHOAI modules beyond AgentOps are added in future development — coverage that does not exist anywhere in the catalog today."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: "lb2144-agentops-ocp-cnv"
    approved_by: ""
    rejections: []
