project:
  slug: "rhai-features-workshop"
  owner_email: "rshah@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "both"
  description: "Default workshop used for AI Roadshows and many other customer facing activities."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1081"
  workflow_id: "b2c16559-e5a0-4b23-9afd-67b120529f85"

spec:
  title: "Fed Aura Capital Workshop: AgentOps Observability with Red Hat OpenShift AI"
  learning_objectives:
    - "Explore a production-pattern multi-agent AI application and identify the observability gap that conventional monitoring tools cannot close"
    - "Monitor AI-specific metrics and KPIs — including LLM token usage, inference latency, and tool-call success rates — using pre-deployed Grafana dashboards"
    - "Analyze structured application logs for a multi-agent system using LokiStack and LogQL queries"
    - "Configure and use MLflow tracing to capture end-to-end agent execution spans, from input/output shields through LLM calls and tool invocations"
    - "Analyze agent traces to identify latency hotspots, failed tool calls, and multi-turn conversation context across user sessions"
    - "Deploy an automated evaluation pipeline and verify prompt regression detection using Red Hat OpenShift AI Data Science Pipelines and MLflow Prompt Registry (optional)"
  modules:
    - id: module-01
      title: "The Agentic App and Why Observability Matters"
      duration_min: 25
      status: not_started
    - id: module-02
      title: "Observability Pillars, Concepts, and Personas"
      duration_min: 15
      status: not_started
    - id: module-03
      title: "Metrics and Logs for Agentic Applications"
      duration_min: 30
      status: not_started
    - id: module-04
      title: "Tracing and MLflow"
      duration_min: 35
      status: not_started
    - id: module-05
      title: "Agent and LLM Evaluations (Optional)"
      duration_min: 55
      status: not_started
    - id: module-06
      title: "From Development to Production (Optional)"
      duration_min: 55
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "multinode"          # sno | multinode — RHOAI+LokiStack+Grafana requires multinode even for single user
    control_plane_instance_count: 3    # 1 if sno, 3 if multinode
    control_plane_cpu: 16             # 32 if sno, 16 if multinode
    control_plane_ram_gb: 64          # 128 if sno, 64 if multinode
    worker_count: 0                    # compact multinode — 3 control plane run workloads, no separate workers (confirmed from agd_v2/ocp-cluster-cnv-pools)
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"             # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: "gpt-oss-120b"      # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products:
      - "Red Hat OpenShift AI 3.5"     # not GA at intake time; expected to GA before catalog release
    non_ga_access_plan: "Pre-GA access via RHDP internal provisioning; anticipated to be GA before catalog item release, but not confirmed — infra reviewer to validate status at staging time"
    external_services: []              # unknown — to be confirmed during development/infra review
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2           # core path (Modules 1-4); optional modules 5-6 add ~2 more hours
  audience: "intermediate"   # beginner | intermediate | advanced

development:
  automation:
    gitops:
      status: not_started
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

